<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADF PDF Reorder</title>
    <meta name="description" content="ADF 스캐너로 양면 스캔 시 뒤섞인 페이지 순서를 올바르게 재배치하는 웹앱입니다.">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <h1>ADF PDF Reorder</h1>
            <p class="subtitle">뒤섞인 스캔 페이지를 원래 순서로 복원합니다</p>
            
            <div class="drop-zone" id="dropZone">
                <svg viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <p>PDF 파일을 여기로 드래그하세요</p>
                <span>또는 클릭하여 파일 선택 (모든 처리는 브라우저에서 안전하게 진행됩니다)</span>
                <input type="file" id="fileInput" accept="application/pdf">
            </div>
            
            <div class="file-info" id="fileInfo">
                <div class="file-info-content">
                    <div class="file-name">
                        📄 <span id="fileName">document.pdf</span>
                    </div>
                </div>
                
                <button class="btn btn-primary" id="processBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                    순서 재정렬하기
                </button>
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-bg">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText">처리 준비 중...</div>
            </div>
            
            <div class="result-section" id="resultSection">
                <button class="btn btn-success" id="downloadBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    정렬된 PDF 다운로드
                </button>
            </div>
        </div>
    </div>
    
    <footer>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        서버로 업로드하지 않습니다. 데이터는 안전합니다.
    </footer>
    
    <script src="reorder.js"></script>
    <script src="app.js"></script>
</body>
</html>
